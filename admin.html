<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de peticiones · Colegio La Paz</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --ink:#1f2a3c; --muted:#5d6b82; --line:#dde3ea; --field:#c3ccd8; --bg:#f3f5f7; --band:#e9eef3; --card:#fff;
    --brand:#1b3260; --brand-2:#2a4c8a; --red:#c8102e; --accent:#c9822b; --ok:#2e7d4f; --err:#b3261e;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  /* Encabezado institucional */
  .site-header{background:#fff;border-bottom:3px solid var(--red)}
  .site-header .wrap{display:flex;align-items:center;gap:36px;min-height:88px}
  .site-header img{height:66px;width:auto;display:block}
  .site-header .titulo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);line-height:1.6;flex:1}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap}
  .hbtn{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer}
  .hbtn:hover{border-color:var(--brand)}
  .band{background:var(--band);font-size:14px;color:var(--brand);padding:12px 0}
  .page-title{font-family:var(--serif);font-weight:400;color:var(--brand);font-size:32px;line-height:1.2;margin:0 0 18px}
  @media (max-width:600px){.site-header .wrap{gap:18px;min-height:72px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}.site-header img{height:50px}.site-header .titulo{font-size:11px}}
  main{padding:32px 0 60px}

  /* Login */
  .login{max-width:500px;margin:10px auto;background:var(--card);padding:28px 26px;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(31,42,60,.05)}
  .login label{display:block;font-weight:600;font-size:14px;color:var(--brand);margin:0 0 6px}
  .login h2{font-family:var(--serif);font-weight:400;color:var(--brand);font-size:34px;line-height:1.2;margin:0 0 8px}
  .login p{color:var(--muted);margin:0 0 18px;font-size:14px}
  input,select,textarea{width:100%;font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--field);border-radius:6px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(27,50,96,.15);background:#fff}
  .btn{font:inherit;font-weight:500;padding:11px 18px;border:0;border-radius:6px;background:var(--brand);color:#fff;cursor:pointer}
  .btn:hover{background:var(--brand-2)}
  .btn:disabled{opacity:.6;cursor:wait}
  .err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  @media (max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border-radius:10px;padding:14px 16px;border:1px solid var(--line);cursor:pointer;transition:.15s}
  .stat:hover,.stat.on{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,93,154,.12)}
  .stat b{display:block;font-size:28px;font-weight:400;color:var(--brand);font-family:var(--serif)}
  .stat span{font-size:13px;color:var(--muted)}

  /* Filtros */
  .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  @media (max-width:800px){.filters{grid-template-columns:1fr 1fr}}

  /* Tarjetas */
  .list{display:grid;gap:14px}
  .item{background:var(--card);border-radius:10px;border:1px solid var(--line);overflow:hidden}
  .item-head{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;cursor:pointer;align-items:flex-start}
  .item-head:hover{background:#fafbfd}
  .who{font-weight:600;font-size:16px;color:var(--brand)}
  .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#eef1f6;color:var(--muted);white-space:nowrap}
  .tag.Pendiente{background:#fff4e0;color:#8a5a12}
  .tag.En\ proceso{background:#e6effa;color:var(--brand-2)}
  .tag.Completada{background:#e3f2e8;color:var(--ok)}
  .tag.Cancelada{background:#eee;color:#777}
  .tag.Alta{background:#fdecd8;color:#9c5a12}
  .tag.Urgente{background:#fbe0de;color:var(--err)}
  .tag.vencida{background:var(--err);color:#fff}
  .tag.pronto{background:var(--accent);color:#fff}
  .item-body{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
  .item.open .item-body{display:block}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:22px;margin-top:16px}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
  .instr{white-space:pre-wrap;background:#fbfbfd;border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14.5px}
  .kv{font-size:14px;margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .att{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:4px}
  .att a{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;color:var(--ink);font-size:12px;background:#fff}
  .att a:hover{border-color:var(--brand-2)}
  .att .th{height:80px;background:#eef1f6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
  .att .nm{padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .manage{background:#f3f5f7;border-radius:8px;padding:14px;margin-top:16px}
  .manage textarea{min-height:70px;margin:8px 0 10px}
  .row{display:flex;gap:10px;align-items:center}
  .saved{font-size:13px;color:var(--ok)}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .loading{text-align:center;color:var(--muted);padding:40px 0}

  /* ===== Ajustes responsivos ===== */
  .item-head > div:first-child,.cols > *{min-width:0}
  .who,.meta,.instr,.kv dd{overflow-wrap:anywhere}
  .filters > *,.stats > *{min-width:0}
  @media (max-width:600px){
    .item-head{flex-direction:column;gap:8px;padding:14px}
    .tags{justify-content:flex-start}
    .item-body{padding:0 14px 14px}
    .page-title{font-size:26px}
    .filters{grid-template-columns:1fr}
    .stat{padding:10px 12px}.stat b{font-size:22px}
    .login{margin:0 auto;padding:22px 18px}
    .login h2{font-size:28px}
    .hbtns{width:100%}
    .hbtn{flex:1;text-align:center}
    main{padding:20px 0 50px}
    .wrap{padding:0 14px}
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <img src="logo.png" alt="Colegio La Paz">
    <div class="titulo">Panel de peticiones<br>Coordinación</div>
    <div class="hbtns" id="hbtns" hidden>
      <button class="hbtn" id="btnRecargar">↻ Actualizar</button>
      <button class="hbtn" id="btnExportar">⬇ CSV</button>
      <button class="hbtn" id="btnSalir">Salir</button>
    </div>
  </div>
</header>
<div class="band"><div class="wrap">Consulta y da seguimiento a las peticiones de los docentes.</div></div>

<main>
  <div class="wrap">
    <!-- Login -->
    <form class="login" id="login">
      <h2>Panel de peticiones</h2>
      <p>Escribe la clave de administrador configurada en el Apps Script.</p>
      <label for="clave">Clave</label>
      <input type="password" id="clave" placeholder="Clave" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button class="btn" id="btnEntrar" style="width:100%">Entrar</button>
    </form>

    <!-- Panel -->
    <section id="panel" hidden>
      <h1 class="page-title">Peticiones de los docentes</h1>
      <div class="stats" id="stats"></div>
      <div class="filters">
        <input type="search" id="fBuscar" placeholder="Buscar profesor, materia, instrucciones, folio…">
        <select id="fEstado"><option value="">Todos los estados</option></select>
        <select id="fMateria"><option value="">Todas las materias</option></select>
        <select id="fOrden">
          <option value="reciente">Más recientes</option>
          <option value="fecha">Fecha requerida (próximas)</option>
          <option value="prioridad">Prioridad</option>
        </select>
      </div>
      <div class="list" id="list"><div class="loading">Cargando…</div></div>
    </section>
  </div>
</main>

<script>
/* ====== CONFIGURACIÓN ====== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwizvmIoJVKyOZa2O9MYzHLIcfBwwjk-zpMLQF239feSPSDdZ210QbzDULMTdGy3hw/exec';
const ESTADOS = ['Pendiente', 'En proceso', 'Completada', 'Cancelada'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = {
  get(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { sessionStorage.setItem(k, v); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
};

let KEY = ss.get('pd_key');
let datos = [];
let filtroEstado = '';
const abiertos = new Set();

async function api(body) {
  const r = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, key: KEY })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}

/* ====== Login ====== */
$('login').addEventListener('submit', async e => {
  e.preventDefault();
  KEY = $('clave').value;
  $('btnEntrar').disabled = true; $('loginErr').textContent = '';
  try { await cargar(); ss.set('pd_key', KEY); mostrarPanel(); }
  catch (err) { $('loginErr').textContent = err.message; KEY = ''; }
  finally { $('btnEntrar').disabled = false; }
});

function mostrarPanel() { $('login').hidden = true; $('panel').hidden = false; $('hbtns').hidden = false; }

$('btnSalir').onclick = () => { ss.del('pd_key'); location.reload(); };
$('btnRecargar').onclick = async () => {
  $('btnRecargar').disabled = true;
  try { await cargar(); } catch (e) { alertar(e.message); }
  $('btnRecargar').disabled = false;
};

async function cargar() {
  const j = await api({ action: 'listar' });
  datos = j.data || [];
  llenarFiltros();
  pintar();
}

/* ====== Filtros ====== */
ESTADOS.forEach(e => $('fEstado').insertAdjacentHTML('beforeend', `<option>${e}</option>`));
['fBuscar','fEstado','fMateria','fOrden'].forEach(id => $(id).addEventListener('input', () => {
  if (id === 'fEstado') filtroEstado = $('fEstado').value;
  pintar();
}));

function llenarFiltros() {
  const sel = $('fMateria'), actual = sel.value;
  const materias = [...new Set(datos.map(d => String(d.materia).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  sel.innerHTML = '<option value="">Todas las materias</option>' + materias.map(m => `<option>${esc(m)}</option>`).join('');
  sel.value = materias.includes(actual) ? actual : '';
}

function diasHasta(fecha) {
  if (!fecha) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fecha + 'T00:00:00');
  return Math.round((f - hoy) / 86400000);
}
function fechaLarga(f) {
  if (!f) return '—';
  return new Date(f + 'T00:00:00').toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

/* ====== Render ====== */
function pintar() {
  // Stats
  const cuenta = e => datos.filter(d => d.estado === e).length;
  const stats = [['', 'Total', datos.length], ...ESTADOS.map(e => [e, e, cuenta(e)])];
  $('stats').innerHTML = stats.map(([k, t, n]) =>
    `<div class="stat ${filtroEstado === k ? 'on' : ''}" data-k="${esc(k)}"><b>${n}</b><span>${esc(t)}</span></div>`).join('');
  $('stats').querySelectorAll('.stat').forEach(s => s.onclick = () => {
    filtroEstado = s.dataset.k; $('fEstado').value = filtroEstado; pintar();
  });

  // Filtrar
  const q = $('fBuscar').value.trim().toLowerCase();
  const mat = $('fMateria').value;
  let lista = datos.filter(d =>
    (!filtroEstado || d.estado === filtroEstado) &&
    (!mat || String(d.materia).trim() === mat) &&
    (!q || [d.id, d.profesor, d.materia, d.grupo, d.tipo, d.instrucciones, d.notas].join(' ').toLowerCase().includes(q))
  );

  const orden = $('fOrden').value;
  const peso = { Urgente: 0, Alta: 1, Normal: 2 };
  if (orden === 'fecha') lista.sort((a,b) => String(a.fecha).localeCompare(String(b.fecha)));
  if (orden === 'prioridad') lista.sort((a,b) => (peso[a.prioridad] ?? 3) - (peso[b.prioridad] ?? 3) || String(a.fecha).localeCompare(String(b.fecha)));

  if (!lista.length) { $('list').innerHTML = '<div class="empty">No hay peticiones con estos filtros.</div>'; return; }

  $('list').innerHTML = lista.map(d => {
    const n = diasHasta(d.fecha);
    const activa = d.estado === 'Pendiente' || d.estado === 'En proceso';
    let fechaTag = '';
    if (activa && n !== null) {
      if (n < 0) fechaTag = `<span class="tag vencida">Vencida hace ${-n} d</span>`;
      else if (n === 0) fechaTag = `<span class="tag vencida">Para hoy</span>`;
      else if (n <= 2) fechaTag = `<span class="tag pronto">En ${n} d</span>`;
    }
    const prio = d.prioridad && d.prioridad !== 'Normal' ? `<span class="tag ${esc(d.prioridad)}">${esc(d.prioridad)}</span>` : '';
    const adj = (d.archivos || []).length ? `<span class="tag">📎 ${d.archivos.length}</span>` : '';

    const archivosHtml = (d.archivos || []).map(a => {
      const m = String(a.url).match(/\/d\/([\w-]+)/);
      const esImg = /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(a.nombre);
      const ext = (a.nombre.split('.').pop() || '').toUpperCase().slice(0, 5);
      const th = esImg && m
        ? `<div class="th" style="background-image:url('https://drive.google.com/thumbnail?id=${m[1]}&sz=w300')"></div>`
        : `<div class="th">${esc(ext || 'ARCHIVO')}</div>`;
      return `<a href="${esc(a.url)}" target="_blank" rel="noopener">${th}<div class="nm" title="${esc(a.nombre)}">${esc(a.nombre)}</div></a>`;
    }).join('');

    return `
    <article class="item ${abiertos.has(d.id) ? 'open' : ''}" data-id="${esc(d.id)}">
      <div class="item-head">
        <div>
          <div class="who">${esc(d.profesor)} · ${esc(d.materia)}${d.grupo ? ' · ' + esc(d.grupo) : ''}</div>
          <div class="meta">${esc(d.tipo)} · Para: <b>${esc(fechaLarga(d.fecha))}</b> · Folio ${esc(d.id)}</div>
        </div>
        <div class="tags">${fechaTag}${prio}${adj}<span class="tag ${esc(d.estado)}">${esc(d.estado)}</span></div>
      </div>
      <div class="item-body">
        <div class="cols">
          <div>
            <h4>Instrucciones</h4>
            <div class="instr">${esc(d.instrucciones)}</div>
            <dl class="kv">
              <dt>Registrada</dt><dd>${esc(d.registrado)}</dd>
              ${d.correo ? `<dt>Correo</dt><dd><a href="mailto:${esc(d.correo)}">${esc(d.correo)}</a></dd>` : ''}
            </dl>
          </div>
          <div>
            <h4>Archivos</h4>
            ${archivosHtml ? `<div class="att">${archivosHtml}</div>` : '<div class="meta">Sin archivos adjuntos.</div>'}
            <div class="manage">
              <h4>Seguimiento</h4>
              <select class="selEstado">${ESTADOS.map(e => `<option ${e === d.estado ? 'selected' : ''}>${e}</option>`).join('')}</select>
              <textarea class="txtNotas" placeholder="Notas internas (opcional)">${esc(d.notas)}</textarea>
              <div class="row"><button class="btn btnGuardar">Guardar</button><span class="saved"></span></div>
            </div>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');

  // Eventos
  $('list').querySelectorAll('.item').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('.item-head').onclick = () => {
      el.classList.toggle('open');
      el.classList.contains('open') ? abiertos.add(id) : abiertos.delete(id);
    };
    el.querySelector('.btnGuardar').onclick = async ev => {
      const b = ev.currentTarget, msg = el.querySelector('.saved');
      const estado = el.querySelector('.selEstado').value;
      const notas = el.querySelector('.txtNotas').value;
      b.disabled = true; msg.textContent = 'Guardando…';
      try {
        await api({ action: 'actualizar', id, estado, notas });
        const d = datos.find(x => x.id === id); d.estado = estado; d.notas = notas;
        pintar();
        const nuevo = $('list').querySelector(`.item[data-id="${CSS.escape(id)}"] .saved`);
        if (nuevo) { nuevo.textContent = '✓ Guardado'; setTimeout(() => nuevo.textContent = '', 2500); }
      } catch (err) { msg.textContent = ''; alertar(err.message); b.disabled = false; }
    };
  });
}

/* ====== Exportar CSV ====== */
$('btnExportar').onclick = () => {
  const cols = ['id','registrado','profesor','correo','materia','grupo','fecha','tipo','prioridad','estado','instrucciones','notas'];
  const filas = [cols.concat('archivos')].concat(datos.map(d =>
    cols.map(c => d[c]).concat((d.archivos || []).map(a => a.url).join(' '))));
  const csv = filas.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'peticiones_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
};

function alertar(t) { $('list').insertAdjacentHTML('afterbegin', `<div class="err" style="padding:10px 0">${esc(t)}</div>`); }

/* ====== Inicio ====== */
if (KEY) {
  cargar().then(mostrarPanel).catch(() => { ss.del('pd_key'); KEY = ''; });
}
</script>
</body>
</html>
